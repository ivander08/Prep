[package]
name = "prep"
version = "0.1.0"
description = "Local-first interview prep"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Spawning and supervising the sidecar. `shell` is the plugin Tauri documents for external
# binaries; `tauri-plugin-shell` reads the `externalBin` list from the config and resolves the
# target-triple-suffixed name itself.
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"

[profile.release]
# The sidecar is 82 MB and dominates the installer, so the Rust shell's own size is worth
# taking seriously: `opt-level = "s"` and LTO cut it substantially at no runtime cost for a
# window that only spawns a child process.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
